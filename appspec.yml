version: 0.0
os: linux

files:
  - source: /
    destination: /home/ec2-user/app

permissions:
  - object: /home/ec2-user/app
    owner: ec2-user
    group: ec2-user
    mode: 755
    type:
      - directory
      - file

hooks:
  ApplicationStop:
    - location: deploy-scripts/stop-server.sh
      timeout: 30
      runas: ec2-user

  AfterInstall:
    - location: deploy-scripts/install-java.sh
      timeout: 120
      runas: root

  ApplicationStart:
    - location: deploy-scripts/start-server.sh
      timeout: 30
      runas: ec2-user
