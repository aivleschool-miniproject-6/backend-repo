version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17

  pre_build:
    commands:
      - echo 빌드 시작
      - java -version

  build:
    commands:
      - echo 빌드 중...
      - chmod +x ./gradlew
      - ./gradlew clean build -x test

  post_build:
    commands:
      - echo 빌드 완료

artifacts:
  files:
    - build/libs/*.jar
  discard-paths: yes

cache:
  paths:
    - '/root/.gradle/caches/**/*'
