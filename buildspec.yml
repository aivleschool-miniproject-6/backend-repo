version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17

  pre_build:
    commands:
      - echo 빌드 시작
      - java -version

  build:
    commands:
      - echo 빌드 중...
      - cd book-backend && chmod +x ./gradlew && ./gradlew clean build -x test

  post_build:
    commands:
      - echo "Build completed on $(date)"

artifacts:
  files:
    - 'book-backend/build/libs/*.jar'
    - 'appspec.yml'
    - 'deploy-scripts/**/*'
  discard-paths: no

cache:
  paths:
    - '/root/.gradle/caches/**/*'
    - '/root/.gradle/wrapper/**/*'
